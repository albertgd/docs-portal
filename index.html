<title>Manual de Sala — Acceso privado</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0F131A;color:#E6EAF0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  .card{width:min(360px,90vw);padding:32px 28px;background:#161C25;border:1px solid #29323E;
    border-radius:12px;box-shadow:0 10px 28px -20px rgba(0,0,0,.8)}
  h1{font-size:17px;margin:0 0 6px;font-weight:600}
  p.sub{font-size:13px;color:#8794A3;margin:0 0 22px}

    color:#E6EAF0;font-size:15px;box-sizing:border-box}
  input:focus{outline:2px solid #8FB3DC;outline-offset:1px}
  button{margin-top:20px;width:100%;padding:11px;background:#8FB3DC;color:#0F131A;border:none;
    border-radius:7px;font-size:15px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .err{margin-top:14px;font-size:13px;color:#E39AA1;min-height:1.2em}
</style>
</head>
<body>

    <input id="p" name="p" type="password" autocomplete="current-password" required>
    <button id="btn" type="submit">Entrar</button>
    <div class="err" id="err"></div>
  </form>
</div>

const ITERATIONS = 400000;

async function deriveKey(passphrase) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: SALT, iterations: ITERATIONS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const u = document.getElementById('u').value;
  const p = document.getElementById('p').value;
  btn.disabled = true; btn.textContent = 'Comprobando…'; err.textContent = '';
  try {
    const key = await deriveKey(u + ':' + p);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: IV }, key, CIPHERTEXT);
    const html = new TextDecoder().decode(plainBuf);
    document.open();
    document.write(html);
    document.close();
  } catch (ex) {
    err.textContent = 'Usuario o contraseña incorrectos.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
