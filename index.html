<style>

  .card{width:min(360px,90vw);padding:32px 28px;background:#161C25;border:1px solid #29323E;

    border-radius:7px;font-size:15px;font-weight:600;cursor:pointer}

</style>

const ITERATIONS = 400000;

async function deriveKey(passphrase) {
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: SALT, iterations: ITERATIONS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
}

document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn');
  const err = document.getElementById('err');
  const u = document.getElementById('u').value;
  const p = document.getElementById('p').value;
  btn.disabled = true; btn.textContent = 'Comprobando…'; err.textContent = '';
  try {
    const key = await deriveKey(u + ':' + p);
    const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: IV }, key, CIPHERTEXT);
    const html = new TextDecoder().decode(plainBuf);
    document.open();
    document.write(html);
    document.close();
  } catch (ex) {
    err.textContent = 'Usuario o contraseña incorrectos.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
});
</script>
